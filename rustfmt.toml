# Formatting, matching the style the rest of this codebase is written in.
#
# Tabs, because they survive being read in editors and on terminals with
# different tab widths.
#
# Only stable options are listed: the nightly-only ones (comment wrapping,
# import grouping) would print a warning on every run for a stable toolchain,
# and a linter that cries wolf is worse than one that checks less.
edition                  = "2024"
style_edition            = "2024"
hard_tabs                = true
newline_style            = "Unix"
use_field_init_shorthand = true
use_try_shorthand        = true
