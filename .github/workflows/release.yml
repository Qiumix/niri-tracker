name: Release

# Tagging is the whole trigger: bump the version in Cargo.toml, commit, tag,
# push the tag.
on:
  push:
    tags: ["v*"]
  # Allows a dry run from the Actions tab without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tag must agree with the manifest, or the release would be named one
      # thing and report another.
      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Build
        run: |
          export CARGO_PROFILE_RELEASE_STRIP=true
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      # The archive layout is what cargo-binstall and the -bin PKGBUILD both
      # expect: a directory named after the target, holding the binary and the
      # files a package needs.
      - name: Package
        run: |
          set -eu
          target="${{ matrix.target }}"
          stage="niri-tracker-$target"
          mkdir -p "$stage"

          cp "target/$target/release/niri-tracker" "$stage/"
          cp packaging/niri-tracker.service "$stage/"
          cp LICENSE "$stage/"
          cp README.md docs/design.md docs/protocol.md "$stage/"

          # The schema is generated by the binary being shipped, so it describes
          # exactly the configuration format that binary accepts.
          "./$stage/niri-tracker" schema > "$stage/schema.json"

          tar -czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            niri-tracker-${{ matrix.target }}.tar.gz
            niri-tracker-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256

  # A separate job so a crates.io hiccup cannot retract a published release.
  crates:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Skipped rather than failing when the version is already published: a
      # re-tagged release must not turn red because the crate is up.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if curl -fsS "https://crates.io/api/v1/crates/niri-tracker/$version" > /dev/null; then
            echo "niri-tracker $version is already on crates.io; nothing to do"
            exit 0
          fi
          cargo publish --locked --registry crates-io
