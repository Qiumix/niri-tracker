[package]
authors     = ["Qiumix <j487428862@gmail.com>"]
categories  = ["command-line-utilities"]
description = "Screen time tracking for the niri Wayland compositor"
edition     = "2024"
homepage    = "https://github.com/Qiumix/niri-tracker"
keywords    = ["niri", "wayland", "screen-time", "tracker"]
license     = "MIT"
name        = "niri-tracker"
readme      = "README.md"
repository  = "https://github.com/Qiumix/niri-tracker"
version     = "0.1.1"

# Everything a `cargo install` cannot use is left out of the crate, which keeps
# it to the code and the documents a reader of the source would want.
exclude = [".github/", "packaging/", "taplo.toml"]

[dependencies]
calloop                = "0.14"
calloop-wayland-source = "0.4"
chrono                 = { version = "0.4", features = ["serde"] }
clap                   = { version = "4", features = ["derive"] }
clap_complete          = "4"
niri-ipc               = "26"
rusqlite               = { version = "0.41", features = ["bundled"] }
schemars               = "1"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
thiserror              = "2"
toml                   = "1"
wayland-client         = "0.31"
wayland-protocols      = { version = "0.32", features = ["client", "staging"] }

[package.metadata.binstall]
bin-dir = "{ name }-{ target }/{ bin }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
